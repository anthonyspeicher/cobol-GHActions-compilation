---

name: Make Release

on:
  push:
    tags:
      # change based on pipeline
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Github release
        env:
          GH_TOKEN: ${{ github.token }}

        run: |
          gh release create "${{ github.ref_name }}" \
          --title "${{ github.ref_name }}" \
          --generate-notes
